name: Clean Old PDD Radar Backups

on:
  push:
    paths:
      - '.github/workflows/cleanup-backups.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove backups older than today
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -eu
            BACKUP_DIR=/opt/pdd-radar-v2-backups
            echo "删除 9 月 2 日及以前的旧备份；保留今天全部备份。"
            find "$BACKUP_DIR" -maxdepth 1 -type f -name '*.tar.gz' -daystart -mtime +0 -print -delete
            df -h /
            ls -lht "$BACKUP_DIR" | head -n 12
