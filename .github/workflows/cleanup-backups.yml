name: Clean Old PDD Radar Backups

on:
  push:
    paths:
      - '.github/workflows/cleanup-backups.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only the latest three valid backups
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            BACKUP_DIR=/opt/pdd-radar-v2-backups
            archives=("$BACKUP_DIR"/*.tar.gz)
            if [ ! -e "${archives[0]}" ]; then exit 0; fi
            IFS=
            for archive in "${archives[@]}"; do
              if tar -tzf "$archive" >/dev/null 2>&1 && [ "$kept" -lt 3 ]; then
                echo "保留有效备份: $archive"
                kept=$((kept + 1))
              else
                echo "删除旧或损坏备份: $archive"
                rm -f -- "$archive"
              fi
            done
            df -h /
            ls -lht "$BACKUP_DIR"
\n' archives=($(ls -1t "$BACKUP_DIR"/*.tar.gz))
            unset IFS
            kept=0
            for archive in "${archives[@]}"; do
              if tar -tzf "$archive" >/dev/null 2>&1 && [ "$kept" -lt 3 ]; then
                echo "保留有效备份: $archive"
                kept=$((kept + 1))
              else
                echo "删除旧或损坏备份: $archive"
                rm -f -- "$archive"
              fi
            done
            df -h /
            ls -lht "$BACKUP_DIR"
