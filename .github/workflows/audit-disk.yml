name: Audit Server Disk Space

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-disk.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect server disk usage
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            df -h /
            echo "--- largest application folders ---"
            du -xh --max-depth=2 /opt/pdd-radar-v2-full /opt/pdd-radar-v2-backups 2>/dev/null | sort -h | tail -n 30
            echo "--- backup archives ---"
            ls -lht /opt/pdd-radar-v2-backups 2>/dev/null | head -n 30
            echo "--- temporary release files ---"
            ls -lht /tmp/pdd-radar-release* 2>/dev/null || true
