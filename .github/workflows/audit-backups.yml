name: Audit PDD Radar Backups

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: List data backups on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -eu
            echo "Available backups:"
            ls -lht /opt/pdd-radar-v2-backups/data-env-*.tar.gz | head -n 20
            echo ""
            echo "Current application data:"
            ls -lh /opt/pdd-radar-v2-full/data/tracker.db 2>/dev/null || true
            echo ""
            echo "Newest backup contents:"
            latest_backup="$(ls -t /opt/pdd-radar-v2-backups/data-env-*.tar.gz | head -n 1)"
            tar -tzf "$latest_backup" | sed -n '1,30p'
