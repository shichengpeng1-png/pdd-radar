name: Deploy to Alibaba Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Package release
        run: tar --exclude=.git --exclude=node_modules --exclude=data --exclude=.env -czf "$RUNNER_TEMP/pdd-radar-release.tar.gz" .

      - name: Upload release to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: ${{ runner.temp }}/pdd-radar-release.tar.gz
          target: /tmp
          strip_components: 4

      - name: Update PDD Radar service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          command_timeout: 15m
          script: |
            rm -rf /tmp/pdd-radar-release
            mkdir -p /tmp/pdd-radar-release
            tar -xzf /tmp/pdd-radar-release.tar.gz -C /tmp/pdd-radar-release
            bash /tmp/pdd-radar-release/deploy-server.sh /tmp/pdd-radar-release.tar.gz

